[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "venv",
    "venv/*",
    "venv/**",
    ".venv",
    ".venv/*",
    ".venv/**",
]